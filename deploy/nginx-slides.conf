# Include inside an existing HTTPS server block to serve Academy lessons.
# The server's other locations remain unchanged.
location ^~ /slides/ {
    root /var/www/fangpian-xuetang/current/public;
    charset utf-8;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
