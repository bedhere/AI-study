server {
    listen 80;
    listen [::]:80;
    server_name 111.228.5.133;

    root /var/www/fangpian-xuetang/current/public;
    charset utf-8;
    autoindex off;
    absolute_redirect off;

    access_log /var/log/nginx/fangpian-xuetang.access.log;
    error_log /var/log/nginx/fangpian-xuetang.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /slides/home.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }
}
