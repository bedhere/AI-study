<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讓 AI 一次只問一道自測題 | 方片学堂</title><meta name="description" content="把已學內容交給實際使用的 AI 工具，透過回答問題檢查理解。"><link rel="icon" href="assets/fangpian/logo-yellow-square.webp"><script src="theme-bridge.js?v=20260816k"></script><link rel="stylesheet" href="lesson.css?v=20260827a"><script src="/slides/external-platform-policy.js"></script></head><body><article class="lesson"><header class="lesson-header"><h1>讓 AI 一次只問一道自測題</h1><p class="subtitle">把已學內容交給實際使用的 AI 工具，透過回答問題檢查理解。</p></header><h2>按這三步試一遍</h2><ol><li>提供學習材料和目標。</li><li>要求一次只出一道題，等你作答後再解析。</li><li>對照原文核驗解析，記錄答錯的原因。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>請根據以下材料考我：【材料】。一次只問一道題，等我回答後再指出依據與遺漏，不要提前給答案。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
