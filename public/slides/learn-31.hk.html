</head><body><article class="lesson"><header class="lesson-header"><h1>讓 AI 一次只問一道自測題</h1><div class="academy-cover" data-academy-cover="knowledge"><div><strong>讓 AI 一次只問一道自測題</strong><p>AI学院 · 方片全员学习</p></div><svg viewBox="0 0 108 108" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="104" height="104" rx="24" fill="var(--accent-soft)" stroke="none"/><path d="M18 20h25c8 0 11 4 11 10v49c-4-5-8-7-14-7H18Z"/><path d="M90 20H65c-8 0-11 4-11 10v49c4-5 8-7 14-7h22Z"/></svg></div><p class="subtitle">把已學內容交給實際使用的 AI 工具，透過回答問題檢查理解。</p></header><h2>按這三步試一遍</h2><ol><li>提供學習材料和目標。</li><li>要求一次只出一道題，等你作答後再解析。</li><li>對照原文核驗解析，記錄答錯的原因。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>請根據以下材料考我：【材料】。一次只問一道題，等我回答後再指出依據與遺漏，不要提前給答案。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
