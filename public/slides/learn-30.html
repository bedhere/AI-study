</head><body><article class="lesson"><header class="lesson-header"><h1>把当前材料清楚地交给 AI</h1><p class="subtitle">提问时主动提供材料、问题和约束；本页不依赖学堂内置助教。</p></header><h2>按这三步试一遍</h2><ol><li>复制需要讨论的原文，保留标题、出处和必要上下文。</li><li>标出你不理解的句子，说明你想解释、比较还是检查。</li><li>要求回答引用你提供的原句；缺少信息时先追问。</li></ol><h2>可以直接使用的提问模板</h2><blockquote>以下是材料原文：【粘贴材料】。我卡在：【具体句子】。请只根据原文解释，并引用依据；原文未说明的地方请标记为需要确认。</blockquote><p>请在你实际使用的 AI 工具中练习。学堂当前未接入聊天、划词提问或笔记云端记忆服务。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
