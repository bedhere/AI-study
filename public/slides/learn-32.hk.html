</head><body><article class="lesson"><header class="lesson-header"><h1>把核驗過的學習筆記留給下一次</h1><div class="academy-cover" data-academy-cover="knowledge"><div><strong>把核驗過的學習筆記留給下一次</strong><p>AI学院 · 方片全员学习</p></div><svg viewBox="0 0 108 108" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="104" height="104" rx="24" fill="var(--accent-soft)" stroke="none"/><path d="M18 20h25c8 0 11 4 11 10v49c-4-5-8-7-14-7H18Z"/><path d="M90 20H65c-8 0-11 4-11 10v49c4-5 8-7 14-7h22Z"/></svg></div><p class="subtitle">普通 AI 對話不一定會自動記住筆記，請主動提供相關上下文。</p></header><h2>按這三步試一遍</h2><ol><li>分開記錄結論、來源、適用條件和待核驗事項。</li><li>下一次提問時貼上相關筆記。</li><li>要求說明使用了哪條筆記，並核對過期資訊。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>已核驗筆記與來源：【筆記】。當前任務：【任務】。請引用相關條目，不要直接採用無關或過期內容。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
