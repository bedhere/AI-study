<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把核驗過的學習筆記留給下一次 | 方片学堂</title><meta name="description" content="普通 AI 對話不一定會自動記住筆記，請主動提供相關上下文。"><link rel="icon" href="assets/fangpian/logo-yellow-square.webp"><script src="theme-bridge.js?v=20260816k"></script><link rel="stylesheet" href="lesson.css?v=20260827a"><script src="/slides/external-platform-policy.js"></script></head><body><article class="lesson"><header class="lesson-header"><h1>把核驗過的學習筆記留給下一次</h1><p class="subtitle">普通 AI 對話不一定會自動記住筆記，請主動提供相關上下文。</p></header><h2>按這三步試一遍</h2><ol><li>分開記錄結論、來源、適用條件和待核驗事項。</li><li>下一次提問時貼上相關筆記。</li><li>要求說明使用了哪條筆記，並核對過期資訊。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>已核驗筆記與來源：【筆記】。當前任務：【任務】。請引用相關條目，不要直接採用無關或過期內容。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
