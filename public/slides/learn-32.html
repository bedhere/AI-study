</head><body><article class="lesson"><header class="lesson-header"><h1>把核验过的学习笔记留给下一次</h1><p class="subtitle">普通 AI 对话不一定会自动记住笔记。主动整理和提供上下文，让记录真正参与下一次任务。</p></header><h2>按这三步试一遍</h2><ol><li>将结论、原始来源、适用条件和待核验事项分开记录。</li><li>下一次提问时，主动粘贴与当前任务相关的笔记。</li><li>要求工具说明使用了哪条笔记；核对过时信息后再更新记录。</li></ol><h2>可以直接使用的提问模板</h2><blockquote>下面是我核验过的笔记：【粘贴笔记与来源】。当前任务：【任务】。请说明哪些笔记相关，引用对应条目；不相关或已过时的内容不要直接采用。</blockquote><p>请在你实际使用的 AI 工具中练习。学堂当前未接入聊天、划词提问或笔记云端记忆服务。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
