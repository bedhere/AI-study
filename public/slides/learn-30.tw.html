<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把當前材料清楚地交給 AI | 方片学堂</title><meta name="description" content="提問時主動提供材料、問題和約束；本頁不依賴學堂內建助教。"><link rel="icon" href="assets/fangpian/logo-yellow-square.webp"><script src="theme-bridge.js?v=20260816k"></script><link rel="stylesheet" href="lesson.css?v=20260827a"><script src="/slides/external-platform-policy.js"></script></head><body><article class="lesson"><header class="lesson-header"><h1>把當前材料清楚地交給 AI</h1><p class="subtitle">提問時主動提供材料、問題和約束；本頁不依賴學堂內建助教。</p></header><h2>按這三步試一遍</h2><ol><li>複製需要討論的原文，保留標題、出處和必要上下文。</li><li>標出不理解的句子，說明需要解釋、比較還是檢查。</li><li>要求引用原句；缺少資訊時先追問。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>原文：【貼上材料】。問題：【具體句子】。請只根據原文解釋並引用依據，原文未說明的地方請標記為需要確認。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
