</head><body><article class="lesson"><header class="lesson-header"><h1>把當前材料清楚地交給 AI</h1><div class="academy-cover" data-academy-cover="knowledge"><div><strong>把當前材料清楚地交給 AI</strong><p>AI学院 · 方片全员学习</p></div><svg viewBox="0 0 108 108" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="104" height="104" rx="24" fill="var(--accent-soft)" stroke="none"/><path d="M18 20h25c8 0 11 4 11 10v49c-4-5-8-7-14-7H18Z"/><path d="M90 20H65c-8 0-11 4-11 10v49c4-5 8-7 14-7h22Z"/></svg></div><p class="subtitle">提問時主動提供材料、問題和約束；本頁不依賴學堂內建助教。</p></header><h2>按這三步試一遍</h2><ol><li>複製需要討論的原文，保留標題、出處和必要上下文。</li><li>標出不理解的句子，說明需要解釋、比較還是檢查。</li><li>要求引用原句；缺少資訊時先追問。</li></ol><h2>可以直接使用的提問模板</h2><blockquote>原文：【貼上材料】。問題：【具體句子】。請只根據原文解釋並引用依據，原文未說明的地方請標記為需要確認。</blockquote><p>請在實際使用的 AI 工具中練習。學堂尚未接入聊天、劃詞提問或筆記雲端記憶服務。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
