</head><body><article class="lesson"><header class="lesson-header"><h1>让 AI 一次只问一道自测题</h1><p class="subtitle">把已学内容交给你正在使用的 AI 工具，通过回答问题检查自己是否理解。</p></header><h2>按这三步试一遍</h2><ol><li>提供本次学习的材料和目标，避免让工具随意猜测课程内容。</li><li>要求一次只出一道题，等你作答后再给解析。</li><li>对照原文核验解析，把答错的原因记录下来，再换一道题验证。</li></ol><h2>可以直接使用的提问模板</h2><blockquote>请根据下面的学习材料考我。一次只问一道题，先等我回答，再指出依据与遗漏。不要提前给答案。材料：【粘贴材料】。</blockquote><p>请在你实际使用的 AI 工具中练习。学堂当前未接入聊天、划词提问或笔记云端记忆服务。</p></article><script src="i18n.js?v=20261109b"></script><script src="lesson.js"></script><script src="nav-inject.js?v=20261109b"></script></body></html>
